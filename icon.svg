<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" fill="#0f172a"/>
  
  <!-- Outer circle -->
  <circle cx="256" cy="256" r="240" fill="#004a8d"/>
  
  <!-- Inner circle with gradient effect -->
  <circle cx="256" cy="256" r="200" fill="#0066cc"/>
  
  <!-- Document/Ledger icon -->
  <g transform="translate(256, 256)">
    <!-- Main document shape -->
    <rect x="-60" y="-80" width="120" height="160" rx="8" fill="#ffffff"/>
    
    <!-- Document lines (representing ledger entries) -->
    <line x1="-50" y1="-60" x2="50" y2="-60" stroke="#004a8d" stroke-width="4" stroke-linecap="round"/>
    <line x1="-50" y1="-35" x2="50" y2="-35" stroke="#004a8d" stroke-width="4" stroke-linecap="round"/>
    <line x1="-50" y1="-10" x2="50" y2="-10" stroke="#004a8d" stroke-width="4" stroke-linecap="round"/>
    <line x1="-50" y1="15" x2="50" y2="15" stroke="#004a8d" stroke-width="4" stroke-linecap="round"/>
    <line x1="-50" y1="40" x2="30" y2="40" stroke="#004a8d" stroke-width="4" stroke-linecap="round"/>
    
    <!-- Checkmark (verification symbol) -->
    <g transform="translate(50, -40)">
      <circle cx="0" cy="0" r="18" fill="#00d084"/>
      <polyline points="-8,0 -2,6 8,-6" stroke="white" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  
  <!-- Text: Civic Ledger -->
  <text x="256" y="420" font-family="Arial, sans-serif" font-size="36" font-weight="bold" fill="#ffffff" text-anchor="middle">Civic Ledger</text>
</svg>